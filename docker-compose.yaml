version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: ai-assistants-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_assistants}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ai_assistants}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai-assistants-backend
    ports:
      - "8080:8080"
    environment:
      PORT: ${PORT:-8080}
      POSTGRES_DSN: ${POSTGRES_DSN:-postgres://postgres:postgres@postgres:5432/ai_assistants?sslmode=disable}
      JWT_SECRET: ${JWT_SECRET:-supersecretkey}
      JWT_EXPIRY: ${JWT_EXPIRY:-24h}
      ADMIN_UUID: ${ADMIN_UUID:-00000000-0000-0000-0000-000000000001}
      USER_UUID: ${USER_UUID:-00000000-0000-0000-0000-000000000002}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ai-assistants-frontend
    ports:
      - "3000:80"
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
    depends_on:
      - backend

volumes:
  postgres_data: